<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="duty-online" content="1">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>당직 근무표</title>
<style>
/* ============================================================
   당직부관 근무표 — 당직부관 도우미 v5 디자인 계열
   색: 스톤 / 코발트 / 탠저린 · 서체: 시스템(맑은 고딕)
   ============================================================ */
:root{
 --bg:#F4F5F2;--side:#EEF0EB;--card:#FFFFFF;--line:#E2E4DF;--line2:#F0F2EE;--text:#17191C;--sub:#62686F;--faint:#9AA0A6;
 --accent:#3355FF;--accentH:#2443E6;--onAccent:#FFFFFF;--accent2:#ECF0FF;
 --now:#FF7A1A;--now2:#FFEDE0;
 --red:#D92D3A;--red2:#FDECEE;--green:#13855A;--green2:#E3F4EC;--amber:#A86400;--amber2:#FFF2DC;
 --paper:#FFFFFF;--pline:#7d7d7d;--pink:#F3C9C4;--sky:#8CCAF0;--yel:#F6D84A;--chg:#2A56C6;
 --r-lg:14px;--r:10px;--r-sm:7px;
 --pop:0 18px 40px -16px rgba(23,25,28,.28),0 2px 8px rgba(23,25,28,.06);
 --ring:0 0 0 3px rgba(51,85,255,.22);
 --sideW:256px;--topH:60px;
 color-scheme:light;
}
[data-theme=dark]{
 --bg:#0E1014;--side:#0B0D10;--card:#161A20;--line:#272C34;--line2:#1C2027;--text:#E9EBEE;--sub:#939AA4;--faint:#5E6570;
 --accent:#7189FF;--accentH:#8C9FFF;--onAccent:#0B0D10;--accent2:#1C2342;
 --now:#FF9445;--now2:#3A2414;
 --red:#FF6B74;--red2:#3A1A1F;--green:#45D193;--green2:#12291F;--amber:#F2B44A;--amber2:#33270F;
 --pop:0 24px 48px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
 --ring:0 0 0 3px rgba(113,137,255,.3);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:"DutySans","Pretendard Variable","Pretendard","맑은 고딕","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
body{background:var(--bg)}
button{font-family:inherit;font-size:14px;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{background:var(--accentH)}
.btn.danger{color:var(--red)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn:disabled{opacity:.4;cursor:default}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 레이아웃 ---------- */
.app{display:grid;grid-template-columns:var(--sideW) minmax(0,1fr);grid-template-rows:var(--topH) 1fr;min-height:100vh}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;height:var(--topH);display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;width:calc(var(--sideW) - 18px);flex:none}
.brand .num{font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1}
.brand .tx{line-height:1.15}
.brand .tx small{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.brand .tx b{font-size:15px}
.mnav{display:flex;align-items:center;gap:4px}
.mnav .lab{min-width:118px;text-align:center;font-size:17px;font-weight:700}
.top .sp{flex:1}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:var(--topH);height:calc(100vh - var(--topH));overflow:auto;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11.5px;font-weight:700;color:var(--faint);padding:10px 10px 4px;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:none;background:transparent;border-radius:var(--r-sm);text-align:left;color:var(--sub);font-weight:600}
.nav button:hover{background:var(--line2);color:var(--text)}
.nav button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--red2);color:var(--red)}
.nav .badge.b{background:var(--accent2);color:var(--accent)}
.today{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.today h5{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:700}
.today .row2{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px}
.today .row2 span:first-child{color:var(--sub)}
.today .row2 b{font-weight:700}
.today .me{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.today .me b{color:var(--now)}
.main{padding:22px 26px 100px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:22px;letter-spacing:-.02em}
.ph p{margin:2px 0 0;color:var(--sub);font-size:13.5px}
.ph .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card+.card{margin-top:14px}
.card h3{margin:0 0 4px;font-size:16px}
.card .desc{margin:0 0 12px;color:var(--sub);font-size:13.5px}
.seg{display:inline-flex;background:var(--line2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:none;background:transparent;border-radius:5px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.sw{color:var(--now)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.fr label{font-size:13px;color:var(--sub);font-weight:600}
.hint{color:var(--sub);font-size:12.5px;line-height:1.65;margin:8px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px}
.tag.ex{background:var(--green2);color:var(--green)}.tag.new{background:var(--accent2);color:var(--accent)}.tag.out{background:var(--red2);color:var(--red)}.tag.ok{background:var(--line2);color:var(--sub)}
.tag.sw{background:var(--now2);color:var(--now)}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 10px;font-size:13.5px;text-align:left;vertical-align:middle}
table.t th{font-size:12.5px;color:var(--sub);font-weight:700;background:var(--line2)}
table.t tr:last-child td{border-bottom:none}
.ri{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid var(--line2)}
.ri .no{width:22px;color:var(--faint);text-align:right;font-size:12.5px}
.ri .btns{margin-left:auto;display:flex;gap:2px}
.ri .btns button{width:26px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:5px;font-size:12px;color:var(--sub)}
.ri .btns button:hover{color:var(--text);border-color:var(--faint)}
.nx{font-size:11.5px;font-weight:700;color:var(--now);background:var(--now2);padding:0 6px;border-radius:8px}
.warn{margin:0;padding-left:18px}.warn li{color:var(--red);margin:4px 0;font-size:13.5px}
.empty-st{color:var(--faint);text-align:center;padding:28px 0}

/* ---------- 근무표 종이 ---------- */
.sheetWrap{overflow-x:auto}
.sheet{background:var(--paper);color:#111;padding:16px 18px;border-radius:var(--r);min-width:760px;border:1px solid var(--line)}
.sheet h2{text-align:center;font-size:28px;letter-spacing:6px;margin:2px 0 6px;color:#111}
.meta{display:flex;justify-content:center;gap:28px;font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--pline);border-top:1px solid var(--pline)}
.cal>div{border-right:1px solid var(--pline);border-bottom:1px solid var(--pline);min-width:0}
.hd{text-align:center;font-size:16px;padding:3px 0;background:#fff}
.hd.sun{background:var(--pink)}
.cell{min-height:116px;display:flex;flex-direction:column;background:#fff}
.dbar{background:var(--yel);text-align:center;font-size:15px;padding:2px 0;border-bottom:1px solid var(--pline);position:relative}
.dbar .hn{font-size:11px;color:#a00;margin-left:3px}
.cell.sun .slots{background:var(--pink)}
.cell.sat .slots{background:var(--sky)}
.slots{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 3px;gap:5px}
.slot{text-align:center;font-size:15px;line-height:1.35;border-radius:5px;padding:2px;position:relative;cursor:pointer}
.slot:hover{background:rgba(255,255,255,.55)}
.ln.chg{color:var(--chg)}
.ln.fin{font-weight:700}
.slot.mine{box-shadow:inset 0 0 0 2px #FF7A1A}
.m-swap .slot{outline:1px dashed #6b7c93}
.slot.sel{outline:3px solid #FF7A1A!important;background:#FFF1E4!important}
.ck{position:absolute;left:3px;top:1px;font-size:13px;color:#C2560C}
.m-hol .dbar{cursor:pointer}.m-hol .dbar:hover{background:#FFB74D}
.m-hol .slot{cursor:default}
.cell.isToday .dbar{box-shadow:inset 0 0 0 2px #d32f2f;font-weight:700}
.cell.fixed .dbar::after{content:"🔒";font-size:10px;position:absolute;right:4px;top:3px}
.emp{background:#f6f6f4}
.nd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:-4px -3px;color:#444;background:repeating-linear-gradient(135deg,#ECECEA 0 7px,#F7F7F5 7px 14px)}
.nd b{font-size:15px}.nd small{font-size:12px;color:#777}
.blank{color:#aaa;text-align:center}
.rotlines{border:1px solid var(--pline);border-top:none;padding:10px 14px;font-size:13.5px;line-height:1.75;text-align:center}
.rotlines hr{border:none;border-top:1px dashed #555;width:60%;margin:6px auto}
.cnt{color:#c0392b}
.notes{border:1px solid var(--pline);border-top:none;padding:10px 14px;color:#2a56c6;font-size:14px;line-height:1.8;white-space:pre-wrap}
.c-ex{color:#1f8a3b}.c-new{color:#2a56c6}.c-out{color:#c62828;text-decoration:line-through}
.panel .c-ex{color:var(--green)}.panel .c-new{color:var(--accent)}.panel .c-out{color:var(--red)}

/* ---------- 하단 바 · 토스트 ---------- */
#bar{position:fixed;left:calc(var(--sideW) + 20px);right:20px;bottom:18px;z-index:30;display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-lg);background:#15191F;color:#E9EBEE;box-shadow:var(--pop);font-size:14px}
#bar .k{color:#FFB37A;font-weight:700}
#bar .hint{color:#9AA3AE;margin:0}
#bar select{background:#232830;color:#E9EBEE;border-color:#3A414B}
#bar .btn{background:#232830;border-color:#3A414B;color:#E9EBEE}
#bar .btn.pri{background:#FF7A1A;border-color:#FF7A1A;color:#15191F}
#bar .btn.danger{color:#FF8A92}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#15191F;color:#fff;padding:10px 18px;border-radius:var(--r);display:none;z-index:40;box-shadow:var(--pop);font-weight:600}
#toast.ok::before{content:"✓ ";color:#45D193}

#modal{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;max-width:440px;width:100%;box-shadow:var(--pop)}
.mmsg{line-height:1.65;font-size:14.5px}
.navToggle{display:none}
.card{overflow-x:auto}
/* 휴대폰 목록 보기 */
.lst{display:flex;flex-direction:column}
.lrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line2);min-height:52px}
.lrow:last-child{border-bottom:none}
.ld{width:62px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-right:1px solid var(--line2);font-size:12px;color:var(--sub)}
.ld b{font-size:19px;color:var(--text);line-height:1.1}
.lrow.sun .ld,.lrow.sun .ld b{color:var(--red)}.lrow.sat .ld,.lrow.sat .ld b{color:var(--accent)}
.lrow.sun{background:color-mix(in srgb,var(--red) 5%,transparent)}.lrow.sat{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.lrow.isToday{box-shadow:inset 4px 0 0 var(--now);background:var(--now2)}
.lrow.isToday .ld b::after{content:"오늘";display:block;font-size:10.5px;color:var(--now);font-weight:800;text-align:center}
.lb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px}
.lhn{font-size:12px;color:var(--red);font-weight:700}
.lsl{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:15.5px}
.lsl:hover{background:var(--line2)}
.lsl .lt{flex:none;font-size:11.5px;font-weight:700;color:var(--sub);background:var(--line2);border-radius:5px;padding:1px 6px;min-width:36px;text-align:center}
.lsl .o{color:var(--faint);text-decoration:line-through;font-size:13.5px}
.lsl .f{font-weight:700}.lsl .f.c{color:var(--accent)}
.lsl.mine{box-shadow:inset 0 0 0 2px var(--now)}
.lsl.sel{outline:2px solid var(--now);background:var(--now2)}
.lnd{color:var(--sub);font-size:14px}.lnd b{color:var(--text)}
.m-hol .ld{cursor:pointer}.m-hol .ld:hover{background:var(--amber2)}
.lrow.fixed .ld::after{content:"🔒";font-size:9px}
/* 잠금 화면 */
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);padding:30px 26px;width:100%;max-width:380px;text-align:center}
.gbox.wide{max-width:520px;text-align:left}
.gbox h1{margin:6px 0 4px;font-size:24px}
.gbox p{color:var(--sub);margin:0 0 16px;font-size:14px}
.glogo{width:56px;height:56px;border-radius:16px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;margin:0 auto;font-size:26px}
#gcode{width:100%;font-size:30px;letter-spacing:14px;text-align:center;padding:10px;font-weight:800}
.gerr{color:var(--red);font-weight:700;font-size:13.5px;min-height:20px;margin:8px 0}
.gbox .btn{width:100%;justify-content:center;height:46px;font-size:16px;margin-top:6px}
.gchk{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;color:var(--sub);margin-top:10px}
.gbox .fr label{width:120px}
.gbox .fr input{flex:1;min-width:0}
/* 게시 배너 */
.dirty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber2);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);color:var(--text);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}
.dirty b{color:var(--amber)}
.roleTag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--line2);color:var(--sub)}
.roleTag.adm{background:var(--green2);color:var(--green)}
.meRow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.meRow .dd{font-size:12px;font-weight:800;color:var(--now);background:var(--now2);border-radius:8px;padding:2px 8px;min-width:52px;text-align:center}
.meRow .dd.t{background:var(--now);color:#fff}
@media(max-width:900px){
 :root{--sideW:0px;--topH:auto}
 html,body{overflow-x:hidden}
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
 .top{height:auto;flex-wrap:wrap;padding:8px 12px;gap:6px}
 .brand{width:auto}.brand .tx small{display:none}.brand .num{font-size:22px}.brand .tx b{font-size:14px}
 .top .sp{flex:1}
 .top .hideM{display:none}
 .mnav{order:5;width:100%;justify-content:space-between;border-top:1px solid var(--line2);padding-top:6px}
 .mnav .lab{font-size:16px;min-width:0}
 .side{position:sticky;top:0;z-index:15;height:auto;padding:8px 12px;gap:8px;border-right:none;border-bottom:1px solid var(--line)}
 .navToggle{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-weight:700;font-size:15px}
 .navToggle .cur{color:var(--accent)}.navToggle .arr{margin-left:auto;color:var(--sub);transition:transform .2s}
 .side.open .navToggle .arr{transform:rotate(180deg)}
 .nav{display:none;grid-template-columns:1fr 1fr;gap:6px}
 .side.open .nav{display:grid}
 .nav .grp{display:none}
 .nav button{height:44px;background:var(--card);border:1px solid var(--line);font-size:14px}
 .nav button.on{box-shadow:inset 0 0 0 2px var(--accent)}
 .today{display:none}
 .grid3,.grid2{grid-template-columns:minmax(0,1fr)}
 .main{padding:14px 12px 130px}
 .ph h1{font-size:20px}
 .ph .seg{width:100%;display:flex}.ph .seg button{flex:1;height:36px}
 .card{padding:14px}
 input,select,textarea{font-size:16px}
 .fr>input[type=date]{flex:1;min-width:140px}
 .fr .btn{height:42px}
 .btn.sm{height:34px}
 #bar{left:8px;right:8px;bottom:8px;padding:10px 12px}
 .sheetHint{display:block!important}
}
@media(max-width:760px){
 .sheetWrap{overflow:visible}
 .sheet{min-width:0;padding:6px 4px;border-radius:8px}
 .sheet h2{font-size:17px;letter-spacing:2px;margin:2px 0 4px}
 .meta{font-size:10px;gap:6px;margin-bottom:6px}
 .hd{font-size:12px;padding:2px 0}
 .dbar{font-size:12px;padding:1px 0}.dbar .hn{display:block;font-size:8.5px;margin:0;line-height:1.1}
 .cell{min-height:64px}
 .slots{padding:2px 1px;gap:3px}
 .slot{font-size:11px;line-height:1.25;padding:1px 0;letter-spacing:-.04em;word-break:keep-all}
 .cell.fixed .dbar::after{font-size:7px;right:1px;top:1px}
 .nd b{font-size:11px}.nd small{font-size:9px}
 .rotlines{font-size:10.5px;padding:6px;line-height:1.6}
 .notes{font-size:11px;padding:6px}
 .ck{font-size:10px;left:1px}
 .card:has(.sheet){padding:6px}
}
@media print{
 @page{size:A4 portrait;margin:8mm}
 html,body{background:#fff}
 .top,.side,.ph,#bar,#toast,.noprint{display:none!important}
 .app{display:block}.main{padding:0}
 .card{border:none;padding:0;background:#fff}
 .sheet{border:none;padding:0;min-width:0}
 .cell.fixed .dbar::after{content:none}
 .slot.sel,.slot.mine{outline:none!important;box-shadow:none!important;background:transparent!important}
 .ck{display:none}.m-swap .slot{outline:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand"><span class="num" id="bNum"></span><span class="tx"><small id="bName"></small><b>당직부관 근무표</b></span></div>
  <div class="mnav">
   <button class="btn ghost sm" onclick="go(-1)" title="이전 달">◀</button>
   <span class="lab" id="mlabel"></span>

<script>
const KEY='dutyRoster17_v1',THEME_KEY='dutyRoster17_theme';

const TN={wd:'평일',d:'주간',n:'야간'};
const TL={wd:'평일 근무순번{월~금}',d:'주말(주간) 근무순번{토~일}',n:'주말(야간) 근무순번{토~일}'};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>pd(s).getDay();
const TODAY=ds(new Date());
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){const x=pd(d);return (x.getMonth()+1)+'/'+x.getDate()+'('+DOW[x.getDay()]+')'}
function editedFmt(s){const x=pd(s);return `${x.getFullYear()} ${pad(x.getMonth()+1)} ${pad(x.getDate())} (${DOW[x.getDay()]})`}
function tsFmt(ts){const x=new Date(ts);return `${x.getMonth()+1}/${x.getDate()} ${pad(x.getHours())}:${pad(x.getMinutes())}`}
function monthDays(m){const[y,mo]=m.split('-').map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>m+'-'+pad(i+1))}
function shiftMonth(m,k){const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function cleanName(s){return String(s||'').replace(/['"<>\\`|]/g,'').trim()}

/* ---------- 페이지 안 확인창 (브라우저 팝업 대신) ---------- */
function modal({msg,input,def,ok='확인',cancel}){return new Promise(res=>{const m=$('#modal');
 m.innerHTML=`<div class="mbox"><div class="mmsg">${esc(msg).replace(/\n/g,'<br>')}</div>${input?`<input id="m_in" value="${esc(def||'')}" style="width:100%;margin-top:12px">`:''}<div class="fr" style="justify-content:flex-end;margin-top:16px">${cancel?`<button class="btn" id="m_no">${cancel}</button>`:''}<button class="btn pri" id="m_ok">${ok}</button></div></div>`;
 m.style.display='flex';const inp=$('#m_in');if(inp){inp.focus();inp.select()}else $('#m_ok').focus();
 const close=v=>{m.style.display='none';m.innerHTML='';document.removeEventListener('keydown',kh);res(v)};
 const kh=e=>{if(e.key==='Escape')close(input?null:false);else if(e.key==='Enter')close(input?$('#m_in').value:true)};
 document.addEventListener('keydown',kh);
 $('#m_ok').onclick=()=>close(input?$('#m_in').value:true);if(cancel)$('#m_no').onclick=()=>close(input?null:false);})}
const note=msg=>modal({msg});
const ask=(msg,ok='확인')=>modal({msg,ok,cancel:'취소'});
const askText=(msg,def)=>modal({msg,input:true,def,ok:'확인',cancel:'취소'});

/* ---------- 기본 데이터 (2026년 11월 종이 근무표 기준) ---------- */
function defaults(){
 if(ONLINE)return blankDefaults();
 
}

function blankDefaults(){const m=TODAY.slice(0,7)+'-01';return{author:'',me:'',edited:TODAY,people:{},rot:{wd:[],d:[],n:[]},holidays:{},anchor:{date:m,wd:'',d:'',n:''},fixed:{},swaps:{},log:[],history:[],noDuty:[],notes:'',v:2,unitNum:'',unitName:''}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function ME(){return ONLINE?(lsGet('dutyOnline_me')||''):S.me}

const G={unlocked:!ONLINE,admin:!ONLINE,dirty:false,unit:null,unitKey:null,salt:null,adm:null,pub:null,file:null,scrolled:false};
const canEdit=()=>!ONLINE||G.admin;
let RESET_NOTE=false;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.rot&&o.people&&!(o.v>=2)){RESET_NOTE=true;return defaults()}if(o&&o.rot&&o.people){o.log=o.log||[];o.history=o.history||[];o.noDuty=o.noDuty||[];if(o.me==null)o.me='';return o}}}catch(e){}return defaults()}
let S=ONLINE?blankDefaults():load();if(!ONLINE&&S.unitNum==null){const d=defaults();S.unitNum=d.unitNum;S.unitName=d.unitName}
let month=TODAY.slice(0,7),pg='cal',mode='view',sel=[],nb=null;

function save(){if(ONLINE){if(!G.admin){render();return}S.edited=TODAY;G.dirty=true;saveDraft();render();return}S.edited=TODAY;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ 브라우저 저장 실패 — [백업 저장]으로 파일을 꼭 저장하세요',1)}render()}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'':'ok';t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- 공휴일 미리 넣기 (2026.4 개정: 노동절·제헌절 공휴일 포함) ---------- */
const PRESET_VER=1;
const PRESET_HOL={
 '2026-12-25':'성탄절',
 '2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일(설날)','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일(노동절)','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일(제헌절)','2027-08-15':'광복절','2027-08-16':'대체공휴일(광복절)','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일(개천절)','2027-10-09':'한글날','2027-10-11':'대체공휴일(한글날)','2027-12-25':'성탄절','2027-12-27':'대체공휴일(성탄절)',
 '2028-01-01':'신정','2028-01-26':'설날 연휴','2028-01-27':'설날','2028-01-28':'설날 연휴','2028-03-01':'삼일절','2028-04-12':'국회의원선거일','2028-05-01':'노동절','2028-05-02':'부처님오신날','2028-05-05':'어린이날','2028-06-06':'현충일','2028-07-17':'제헌절','2028-08-15':'광복절','2028-10-02':'추석 연휴','2028-10-03':'추석·개천절','2028-10-04':'추석 연휴','2028-10-05':'대체공휴일','2028-10-09':'한글날','2028-12-25':'성탄절',
 '2029-01-01':'신정','2029-02-12':'설날 연휴','2029-02-13':'설날','2029-02-14':'설날 연휴','2029-03-01':'삼일절','2029-05-01':'노동절','2029-05-05':'어린이날','2029-05-07':'대체공휴일(어린이날)','2029-05-20':'부처님오신날','2029-05-21':'대체공휴일(부처님오신날)','2029-06-06':'현충일','2029-07-17':'제헌절','2029-08-15':'광복절','2029-09-21':'추석 연휴','2029-09-22':'추석','2029-09-23':'추석 연휴','2029-09-24':'대체공휴일(추석)','2029-10-03':'개천절','2029-10-09':'한글날','2029-12-25':'성탄절',
 '2030-01-01':'신정','2030-02-02':'설날 연휴','2030-02-03':'설날','2030-02-04':'설날 연휴','2030-02-05':'대체공휴일(설날)','2030-03-01':'삼일절','2030-05-01':'노동절','2030-05-05':'어린이날','2030-05-06':'대체공휴일(어린이날)','2030-05-09':'부처님오신날','2030-06-06':'현충일','2030-07-17':'제헌절','2030-08-15':'광복절','2030-09-11':'추석 연휴','2030-09-12':'추석','2030-09-13':'추석 연휴','2030-10-03':'개천절','2030-10-09':'한글날','2030-12-25':'성탄절'
};
function applyPreset(){if((S.presetVer||0)>=PRESET_VER)return;for(const d in PRESET_HOL)if(d>=S.anchor.date&&!has(S.holidays,d))S.holidays[d]=PRESET_HOL[d];S.presetVer=PRESET_VER}

/* ---------- 순번 계산 ---------- */
function isOff(s){const w=dow(s);return w===0||w===6||has(S.holidays,s)}
function ndLast(q){return q.endDuty&&q.to>q.from?addD(q.to,-1):q.to}
function ndOf(d){return (S.noDuty||[]).find(q=>d>=q.from&&d<=ndLast(q))}
function slotsOf(s){return isOff(s)?['d','n']:['wd']}
function inPeriod(p,d){return p.periods.find(q=>d>=q.from&&(!q.to||d<=q.to))}
function eligible(name,d,t){const p=S.people[name];if(!p)return false;
 if(p.start&&p.start[t]&&d<=p.start[t])return false;
 if(p.out&&d>=p.out)return false;
 return !inPeriod(p,d);}
function generate(until){
 const res={},ptr={},keyAt={},dateOf={},occ={wd:{},d:{},n:{}};
 for(const t of ['wd','d','n']){const i=S.rot[t].indexOf(S.anchor[t]);ptr[t]=i<0?0:i}
 let d=S.anchor.date,guard=0;
 while(d<=until&&guard++<4000){const nd=ndOf(d);if(nd){res[d]={_nd:nd.reason||'훈련'};d=addD(d,1);continue}const r={};
  for(const t of slotsOf(d)){const L=S.rot[t];let who=null;
   const f=L.find(n=>S.people[n]&&S.people[n].start&&S.people[n].start[t]===d&&!(S.people[n].out&&d>=S.people[n].out));
   if(f){who=f;if(L[ptr[t]]===f)ptr[t]=(ptr[t]+1)%L.length}
   else{for(let k=0;k<L.length;k++){const n=L[(ptr[t]+k)%L.length];if(eligible(n,d,t)){who=n;ptr[t]=(ptr[t]+k+1)%L.length;break}}}
   r[t]=who;
   if(who){const c=occ[t][who]=(occ[t][who]||0)+1;const k=t+'|'+who+'|'+c;keyAt[d+'|'+t]=k;dateOf[k]=d}}
  res[d]=r;d=addD(d,1)}
 return {res,ptr,keyAt,dateOf};
}
/* 교대는 날짜가 아니라 "그 사람의 N번째 차례"에 붙어요 → 순번이 밀리면 교대도 사람을 따라 이동 */
function genFull(){return generate(addD(S.anchor.date,550))}
function keyOf(d,t){return d<S.anchor.date?null:(generate(d).keyAt[d+'|'+t]||null)}
function chainsFor(dates){
 dates=[...dates].sort();const last=dates[dates.length-1];
 const G=last>=S.anchor.date?generate(last):{res:{},keyAt:{}};const out={};
 for(const d of dates){
  if(d<S.anchor.date){out[d]=S.fixed[d]?JSON.parse(JSON.stringify(S.fixed[d])):null}
  else{const r=G.res[d]||{},o={};for(const t in r)if(t==='_nd')o._nd=r._nd;else o[t]=[r[t]||'(없음)',...(S.swaps[G.keyAt[d+'|'+t]]||[])];out[d]=o}
 }
 return out;
}
function finalOf(d,t){const c=chainsFor([d])[d];const ch=c&&c[t];return ch?ch[ch.length-1]:null}
function swapDates(){const G=genFull(),o={};for(const k in S.swaps)o[k]=G.dateOf[k]||null;return o}
function mutate(fn){const b=swapDates();if(fn()===false)return false;const a=swapDates();
 const moved=Object.keys(b).filter(k=>k in a&&a[k]!==b[k]&&S.swaps[k]).map(k=>{const[t,p]=k.split('|');const arr=S.swaps[k];return a[k]?`${TN[t]} ${p} 차례 → ${arr[arr.length-1]} : ${b[k]?fmt(b[k]):'-'}에서 ${fmt(a[k])}로 이동`:`${TN[t]} ${p} 차례 → ${arr[arr.length-1]} : 해당 근무를 찾을 수 없어요 (교대 이력 확인)`});
 save();if(moved.length)setTimeout(()=>note('ℹ 순번이 밀리면서 교대(→)도 사람을 따라 같이 옮겨졌어요.\n\n'+moved.join('\n')),50);return true}
/* 확정·확정취소처럼 기준일이 바뀔 때 교대 키를 다시 맞춤 */
function rekey(change){const R=genFull().dateOf;const kept=S.swaps;change();const G=genFull();const ns={};
 for(const k in kept){const d=R[k],t=k.split('|')[0];if(d&&d<S.anchor.date)continue;const nk=d?G.keyAt[d+'|'+t]:null;ns[nk||k]=kept[k]}
 S.swaps=ns;
 S.log.forEach(e=>sides(e).forEach(x=>{if(!x.k)return;const d=R[x.k];if(!d)return;x.d=d;if(d<S.anchor.date)x.k=null;else{const nk=G.keyAt[d+'|'+x.t];if(nk)x.k=nk}}));
 return G}
function migrate(){if(S.v>=2)return;const G=genFull(),ns={};
 for(const k in S.swaps){if(/^\d{4}-\d{2}-\d{2}\|(wd|d|n)$/.test(k)){const nk=G.keyAt[k];if(nk)ns[nk]=S.swaps[k]}else ns[k]=S.swaps[k]}
 S.swaps=ns;S.log.forEach(e=>sides(e).forEach(x=>{if(!x.k&&x.d>=S.anchor.date){const nk=G.keyAt[x.d+'|'+x.t];if(nk)x.k=nk}}));S.v=2}

/* ---------- 이름 색상 ---------- */
function nameCls(n){const p=S.people[n];if(!p)return'';const ms=month+'-01',me=monthDays(month).pop();
 if(p.out&&p.out<=me)return'c-out';
 if(p.periods.some(q=>q.from<=me&&(!q.to||q.to>=ms)))return'c-ex';
 if(p.join&&p.join>=addD(ms,-45)&&p.join<=me)return'c-new';return''}
function statusTag(n){const c=nameCls(n);return c==='c-out'?'<span class="tag out">제외</span>':c==='c-ex'?'<span class="tag ex">공제·파견</span>':c==='c-new'?'<span class="tag new">신규</span>':'<span class="tag ok">근무</span>'}

/* ---------- 교대 / 대근 / 취소 ---------- */
function slotRef(d,t){return d<S.anchor.date?{d,t,k:null}:{d,t,k:keyOf(d,t)}}
function refArr(x){if(x.k)return{arr:S.swaps[x.k]||[],min:0};const f=S.fixed[x.d];return{arr:(f&&f[x.t])||[],min:1}}
function pushTo(x,name){if(x.k)(S.swaps[x.k]=S.swaps[x.k]||[]).push(name);else{const f=S.fixed[x.d]=S.fixed[x.d]||{};(f[x.t]=f[x.t]||['(없음)']).push(name)}}
function topRef(x){const r=refArr(x);return r.arr.length>r.min?r.arr[r.arr.length-1]:null}
function popRef(x){const r=refArr(x);if(r.arr.length<=r.min)return;r.arr.pop();if(x.k&&!r.arr.length)delete S.swaps[x.k]}
function topOf(d,t){return topRef(slotRef(d,t))}
function sides(e){return e.b?[e.a,e.b]:[e.a]}
function curD(x,G){return x.k?((G||genFull()).dateOf[x.k]||null):x.d}
function sd(x,G){const d=curD(x,G);return d?fmt(d):'<span style="color:var(--red)">근무 없음</span>'}
function logText(e,G){return e.type==='swap'?`${sd(e.a,G)} ${TN[e.a.t]} <b>${esc(e.a.from)}</b> ⇄ ${sd(e.b,G)} ${TN[e.b.t]} <b>${esc(e.b.from)}</b>`:`${sd(e.a,G)} ${TN[e.a.t]} <b>${esc(e.a.from)}</b> → <b>${esc(e.a.to)}</b> 대근`}
function logPlain(e){const G=genFull(),f=x=>{const d=curD(x,G);return d?fmt(d):'(근무 없음)'};return e.type==='swap'?`${f(e.a)} ${TN[e.a.t]} ${e.a.from} ⇄ ${f(e.b)} ${TN[e.b.t]} ${e.b.from}`:`${f(e.a)} ${TN[e.a.t]} ${e.a.from} → ${e.a.to} 대근`}
function sameRef(x,r){return r.k?x.k===r.k:(!x.k&&x.d===r.d&&x.t===r.t)}
function findLog(d,t){const r=slotRef(d,t),top=topRef(r);if(!top)return null;for(let i=S.log.length-1;i>=0;i--){const e=S.log[i];if(sides(e).some(x=>sameRef(x,r)&&x.to===top))return e}return null}
async function cancelLog(id,skipConfirm){const e=S.log.find(x=>x.id===id);if(!e)return;
 const blocked=sides(e).filter(x=>topRef(x)!==x.to);
 if(blocked.length){
  if(blocked.some(x=>refArr(x).arr.includes(x.to)))return note(`이 교대 뒤로 같은 근무에 다른 교대가 또 있어요.\n[교대 이력]에서 나중 교대를 먼저 취소해 주세요.`);
  if(!await ask(`이 교대 내용이 근무표에 남아 있지 않아요.\n이력에서만 삭제할까요?`))return;
  S.log=S.log.filter(x=>x.id!==id);save();return}
 if(!skipConfirm&&!await ask(`이 ${e.type==='swap'?'교대':'대근'}를 취소할까요?\n\n${logPlain(e)}\n\n${e.type==='swap'?'두 근무 모두':'이 근무가'} 원래대로 돌아갑니다.`))return;
 sides(e).forEach(popRef);S.log=S.log.filter(x=>x.id!==id);sel=[];save();toast((e.type==='swap'?'교대':'대근')+' 취소 — 원래대로 복구')}
function doSwap(){const[a,b]=sel;const ra=slotRef(a.d,a.t),rb=slotRef(b.d,b.t);
 if((a.d>=S.anchor.date&&!ra.k)||(b.d>=S.anchor.date&&!rb.k))return note('근무자가 없는 칸은 교대할 수 없어요.');
 const pa=finalOf(a.d,a.t),pb=finalOf(b.d,b.t);if(pa===pb)return note('두 근무의 근무자가 같은 사람입니다.');
 pushTo(ra,pb);pushTo(rb,pa);

function calcNb(){syncRows();const rows=nbRows.filter(r=>r.name.trim()||r.join);
 if(!rows.length)return note('이름과 전입일을 넣어주세요');
 const seen=new Set();
 for(const r of rows){const n=cleanName(r.name);if(!n||!r.join)return note('모든 줄에 이름과 전입일을 넣어주세요');if(S.people[n])return note(n+'은(는) 이미 명단에 있는 이름이에요');if(seen.has(n))return note(n+' 이름이 두 번 들어갔어요');seen.add(n)}
 const taken=new Set();Object.values(S.people).forEach(p=>{if(p.start)for(const t in p.start)taken.add(t+'|'+p.start[t])});
 const free=(t,x)=>{let g=0;while((t==='wd'?isOff(x):!isOff(x))||taken.has(t+'|'+x)){x=addD(x,1);if(g++>400)break}taken.add(t+'|'+x);return x};
 nb=rows.map(r=>{const name=cleanName(r.name),kind=r.kind,base=KIND[kind].base(r.join);let wd=base,g=0;while(isOff(wd)&&g++<60)wd=addD(wd,1);
  let st=wd;while(dow(st)!==6)st=addD(st,1);const d0=addD(st,7),n0=addD(st,14);
  const o={name,kind,join:r.join,base,wd:free('wd',wd),d:free('d',d0),n:free('n',n0)};o.moved=o.wd!==wd||o.d!==d0||o.n!==n0;return o});
 render()}

 })){nb=null;nbRows=[{name:'',kind:'normal',join:''}];render();toast(list.join(', ')+' 등록 완료')}}

async function freezeUntil(until){
 if(!await ask(`${fmt(S.anchor.date)} ~ ${fmt(until)} 근무를 확정(🔒)할까요?\n확정 후엔 순번·휴일·공제를 바꿔도 이 기간은 바뀌지 않습니다.\n(교대·교대 취소는 계속 가능, 필요하면 확정 취소 가능)`))return;
 const snap={anchor:{...S.anchor},dates:[]};
 rekey(()=>{const G=generate(until);
  for(let d=S.anchor.date;d<=until;d=addD(d,1)){const day={},r=G.res[d]||{};
   for(const t in r){if(t==='_nd'){day._nd=r._nd;continue}const k=G.keyAt[d+'|'+t];day[t]=[r[t]||'(없음)',...((k&&S.swaps[k])||[])];if(k)delete S.swaps[k]}
   S.fixed[d]=day;snap.dates.push(d)}
  S.anchor={date:addD(until,1),wd:S.rot.wd[G.ptr.wd]||'',d:S.rot.d[G.ptr.d]||'',n:S.rot.n[G.ptr.n]||''}});

async function unfreeze(){const s=S.history[S.history.length-1];if(!s)return;
 if(!await ask(`${fmt(s.dates[0])} ~ ${fmt(s.dates[s.dates.length-1])} 확정을 취소할까요?\n이 기간은 다시 순번대로 자동 계산됩니다 (교대 기록은 유지).`))return;
 const chains=[];s.dates.forEach(d=>{const f=S.fixed[d];if(f)for(const t in f)if(t!=='_nd'&&f[t].length>1)chains.push([d,t,f[t].slice(1)])});
 S.history.pop();
 const G=rekey(()=>{s.dates.forEach(d=>delete S.fixed[d]);S.anchor=s.anchor});
 chains.forEach(([d,t,a])=>{const k=G.keyAt[d+'|'+t];if(k)S.swaps[k]=a});
 S.log.forEach(e=>sides(e).forEach(x=>{if(!x.k&&x.d>=S.anchor.date){const k=G.keyAt[x.d+'|'+x.t];if(k)x.k=k}}));
 save();toast('확정 취소 완료')}
function pageClose(){const end=monthDays(month).pop();

 <div class="fr">${end>=S.anchor.date?`<button class="btn pri" onclick="freezeUntil('${end}')">${+month.slice(5)}월 말일(${fmt(end)})까지 확정</button>`:'<span class="tag ok">이 달은 이미 확정됐어요</span>'}${S.history.length?'<button class="btn" onclick="unfreeze()">↶ 마지막 확정 취소</button>':''}</div>
 <p class="hint">추천 순서: 근무표 완성 → 인쇄·배포 → 그 달 확정 → 다음 달로 이동</p></div>`;

function monthWarn(){
 const days=monthDays(month),ext=[addD(days[0],-1),...days,addD(days[days.length-1],1)],C=chainsFor(ext);
 const per=d=>{const o=C[d];if(!o)return[];return['wd','d','n'].filter(t=>o[t]).map(t=>({d,t,n:o[t][o[t].length-1]}))};
 const cnt={},W=[];
 days.forEach(d=>per(d).forEach(x=>{(cnt[x.n]=cnt[x.n]||{wd:0,d:0,n:0})[x.t]++}));
 [addD(days[0],-1),...days].forEach(d=>{const a=per(d),b=per(addD(d,1));
  const dd=a.find(x=>x.t==='d'),nn=a.find(x=>x.t==='n');
  if(days.includes(d)&&dd&&nn&&dd.n===nn.n)W.push(`${fmt(d)} ${dd.n}: 같은 날 주간·야간 연속`);
  a.forEach(x=>b.forEach(y=>{if(x.n===y.n&&x.n!=='(없음)')W.push(`${fmt(d)} → ${fmt(y.d)} ${x.n}: 이틀 연속 근무 (${TN[x.t]}→${TN[y.t]})`)}))});
 days.forEach(d=>per(d).forEach(x=>{if(x.n==='(없음)'){W.push(`${fmt(d)} ${TN[x.t]}: 근무자 없음`);return}const p=S.people[x.n];if(!p)return;const q=inPeriod(p,d);
  if(q)W.push(`${fmt(d)} ${x.n}: 공제·파견 기간(${q.reason||'사유 없음'})인데 근무 배정`);
  if(p.out&&d>=p.out)W.push(`${fmt(d)} ${x.n}: 제외된 인원이 근무 배정`)}));
 return{cnt,W:[...new Set(W)]};
}

/* ================= 온라인(GitHub) 모드: 부대번호 잠금 · 관리자 · 게시 ================= */
const ITER=250000,te=new TextEncoder(),tdc=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ub64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function pbk(pass){return crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey','deriveBits'])}
async function kdf(pass,salt){return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},await pbk(pass),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function hashPw(pass,salt){return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},await pbk(pass),256))}
async function encWith(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))))}}
async function decWith(key,f){return JSON.parse(tdc.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(f.iv)},key,ub64(f.ct))))}
const is4=x=>/^\d{4}$/.test(x||'');

function gate(html,wide){const g=$('#gate');g.innerHTML=`<div class="gbox${wide?' wide':''}">${html}</div>`;g.style.display='flex'}

async function fetchRemote(){const r=await fetch('data.enc?t='+Date.now(),{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

async function unlock(code,silent){

 if(!G.adm)return note('아직 관리자번호가 설정되지 않았어요.');if(!await checkAdmin(v.trim())){await new Promise(r=>setTimeout(r,700));return note('관리자번호가 맞지 않아요')}
 G.admin=true;G.admCode=v.trim();sessionStorage.setItem('dutyOnline_adm',G.admCode);restoreDraft();render();toast('관리자 모드 — 수정 후 [게시]를 눌러주세요')}

function repoGuess(){const h=location.hostname,o=h.endsWith('.github.io')?h.split('.')[0]:'';const seg=location.pathname.split('/').filter(Boolean)[0];return o?(o+'/'+(seg&&!/\.html?$/.test(seg)?seg:o+'.github.io')):''}
async function tokKey(salt){return kdf(G.unit+'#'+G.admCode,salt)}
async function getToken(){const r=lsGet('dutyOnline_tok');if(!r)return null;try{const t=JSON.parse(r);return{tok:await decWith(await tokKey(ub64(t.salt)),t),repo:t.repo}}catch(e){return null}}
async function setToken(){
 const repo=await modal({msg:'게시할 GitHub 저장소 (계정/저장소)',input:true,def:(()=>{try{return JSON.parse(lsGet('dutyOnline_tok')).repo}catch(e){return repoGuess()}})(),ok:'다음',cancel:'취소'});if(repo==null)return false;
 const tok=await modal({msg:'GitHub 토큰을 붙여넣으세요.\n\n① github.com/settings/personal-access-tokens/new\n② Resource owner: 이 저장소의 계정\n③ Repository access: 이 저장소만\n④ Permissions → Contents: Read and write\n⑤ 만들어진 github_pat_… 값을 복사\n\n토큰은 관리자번호로 암호화해서 이 기기에만 저장돼요.',input:true,ok:'저장',cancel:'취소'});if(tok==null||!tok.trim())return false;
 const t=tok.trim();try{const r=await fetch(`https://api.github.com/repos/${repo.trim()}`,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);if(!(j.permissions&&j.permissions.push))throw new Error('쓰기 권한이 없어요')}catch(e){await note('토큰 확인 실패: '+e.message+'\n저장소 이름과 토큰 권한(Contents: Read and write)을 확인해주세요.');return false}
 const salt=crypto.getRandomValues(new Uint8Array(16));const e=await encWith(await tokKey(salt),t);lsSet('dutyOnline_tok',JSON.stringify({salt:b64(salt),...e,repo:repo.trim()}));toast('토큰 저장 완료');return true}
async function buildFile(){const e=await encWith(G.unitKey,{S,adm:G.adm});return{v:1,pub:new Date().toISOString(),salt:b64(G.salt),...e}}
async function publish(){if(!G.admin)return;
 let T=await getToken();if(!T){if(!await ask('이 기기에서 처음 게시하는 거라 GitHub 토큰 등록이 필요해요. 지금 등록할까요?','등록'))return;if(!await setToken())return;T=await getToken()}
 toast('게시하는 중…');
 const dir=location.pathname.replace(/[^/]*$/,'').replace(/^\//,''),fp=(T.repo.endsWith('.github.io')?dir:dir.split('/').slice(1).join('/'))+'data.enc';
 const api=`https://api.github.com/repos/${T.repo}/contents/${fp}`,H={Authorization:'Bearer '+T.tok,Accept:'application/vnd.github+json'};
 try{let sha=null;const g=await fetch(api+'?t='+Date.now(),{headers:H,cache:'no-store'});
  if(g.ok){const j=await g.json();sha=j.sha;try{const cur=JSON.parse(atob(j.content.replace(/\n/g,'')));if(G.pub&&cur.pub!==G.pub&&!await ask('다른 기기에서 그 사이에 게시한 내용이 있어요. 지금 내용으로 덮어쓸까요?','덮어쓰기'))return}catch(e){}}
  else if(g.status!==404){const j=await g.json().catch(()=>({}));throw new Error(j.message||('HTTP '+g.status))}
  const file=await buildFile();
  const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'근무표 게시 '+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}),content:btoa(JSON.stringify(file)),...(sha?{sha}:{})})});
  const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
  G.pub=file.pub;G.file=file;G.dirty=false;lsSet('dutyOnline_draft',null);render();note('게시 완료!\n1~2분 안에 모든 사람 화면에 반영돼요.')}
 catch(e){note('게시 실패: '+e.message+'\n\n인터넷 연결과 토큰을 확인해주세요. 변경 내용은 이 기기에 그대로 남아 있어요.')}}

 gate(`<div style="text-align:center"><div class="glogo">🛠</div><h1>처음 설정</h1><p>아직 게시된 근무표가 없어요. 관리자가 한 번만 설정하면 돼요.</p></div>
 <div class="fr"><label>부대 (숫자·이름)</label><input id="su_n" placeholder="숫자" style="max-width:70px"><input id="su_nm" placeholder="부대 이름"></div>
 <div class="fr"><label>부대번호 4자리</label><input id="su_u" type="password" inputmode="numeric" maxlength="4"></div>

 <p class="hint">독립망 PC 근무표에서 [백업 저장]한 파일을 고르면 그대로 옮겨져요. 비워두면 빈 근무표로 시작해요.</p>
 <div class="gerr" id="gerr"></div><button class="btn pri" onclick="setupDone()">설정 완료</button>`,true)}
async function setupDone(){const u=$('#su_u').value.trim(),a=$('#su_a').value.trim(),a2=$('#su_a2').value.trim();
 if(!is4(u)||!is4(a))return $('#gerr').textContent='번호는 숫자 4자리로 입력하세요';if(a!==a2)return $('#gerr').textContent='관리자번호가 서로 달라요';
 let data=blankDefaults();const f=$('#su_f').files[0];
 if(f){try{const o=JSON.parse(await f.text());if(!o.rot||!o.people)throw 0;data=o}catch(e){return $('#gerr').textContent='올바른 백업 파일이 아니에요'}}
 data.unitNum=$('#su_n').value.trim()||data.unitNum||'';data.unitName=$('#su_nm').value.trim()||data.unitName||'';data.me='';
 $('#gerr').textContent='설정 중…';
 G.salt=crypto.getRandomValues(new Uint8Array(16));G.unitKey=await kdf(u,G.salt);G.unit=u;
 const as=crypto.getRandomValues(new Uint8Array(16));G.adm={salt:b64(as),hash:await hashPw(u+'#'+a,as)};
 Object.assign(G,{admCode:a,admin:true,unlocked:true,dirty:true,pub:null});S=data;
 lsSet('dutyOnline_unit',u);sessionStorage.setItem('dutyOnline_adm',a);migrate();applyPreset();saveDraft();gateOff();render();
 note('설정 완료! 이제 [게시]를 눌러 GitHub에 올려주세요.\n처음 게시할 때 GitHub 토큰을 한 번 등록해요.')}
window.addEventListener('beforeunload',e=>{if(ONLINE&&G.dirty){e.preventDefault();e.returnValue=''}});

const PAGES={me:pageMe,nd:pageNd,cal:pageCal,log:pageLog,rot:pageRot,ppl:pagePpl,new:pageNew,hol:pageHol,close:pageClose,stat:pageStat,set:pageSet};
if(ONLINE){boot()}else{
migrate();applyPreset();
if(RESET_NOTE){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
render();
}
if(!ONLINE&&RESET_NOTE)note('새 버전으로 바뀌면서 근무표를 종이 근무표(11/4 수정본) 상태로 원위치했어요.\n\n이제 교대는 사람 차례를 따라가요. 철야훈련 등은 [훈련(근무 없음)]에서 다시 넣어주세요.');
</script>
